name: JURIS backend validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "**"
    paths:
      - "api/**"
      - "agent/**"
      - "core/**"
      - "tools/**"
      - "gateway/**"
      - "models/**"
      - "monitoring/**"
      - "tests/**"
      - "main.py"
      - "pyproject.toml"
      - ".github/workflows/juris-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project and test dependencies
        run: uv sync --group dev
      - name: Run full JURIS test suite
        run: uv run pytest -q
