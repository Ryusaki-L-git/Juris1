name: JURIS security config tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/fail-closed-config-main-2026-10-29]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "pydantic-settings>=2.15.0" "pytest>=9.1.1"
      - name: Test runtime defaults
        run: python -m pytest tests/test_config_defaults.py -q
